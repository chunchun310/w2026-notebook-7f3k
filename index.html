<head>

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"Microsoft YaHei",system-ui,sans-serif; background:#f4f6fb; color:#2b2f36; min-height:100vh; }
.container { max-width:860px; margin:0 auto; padding:20px 16px 60px; }
h1 { font-size:22px; margin-bottom:4px; }
.subtitle { color:#7a8190; font-size:13px; margin-bottom:16px; }
.banners { position:sticky; top:0; z-index:10; }
.banner { display:none; padding:10px 14px; border-radius:10px; margin-bottom:8px; font-size:14px; font-weight:bold; box-shadow:0 2px 8px rgba(0,0,0,.08); }
.banner.show { display:block; }
.banner.yellow { background:#fff7e0; color:#8a6100; border:1px solid #f0d060; }
.banner.orange { background:#ffefd9; color:#9a4d00; border:1px solid #f0a860; }
.banner.red { background:#ffe5e5; color:#b00020; border:1px solid #ff8a8a; }
.cards { display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1fr); gap:14px; }
@media (max-width:700px){ .cards{grid-template-columns:minmax(0,1fr);} }
.card { background:#fff; border-radius:14px; padding:16px; box-shadow:0 2px 10px rgba(30,40,80,.06); min-width:0; overflow:hidden; }
.card h2 { font-size:15px; margin-bottom:12px; color:#3a4150; }
.formrow { display:flex; gap:8px; margin-bottom:10px; }
input,select { flex:1; padding:9px 10px; border:1px solid #d8dce6; border-radius:9px; font-size:15px; background:#fafbfe; min-width:0; }
input:focus,select:focus { outline:none; border-color:#5b8def; }
.btn { padding:10px 18px; border:none; border-radius:9px; background:#4a7df0; color:#fff; font-size:15px; font-weight:bold; cursor:pointer; }
.btn:hover { background:#3a6cd8; }
.btn.small { padding:4px 10px; font-size:12px; font-weight:normal; }
.btn.ghost { background:#eef1f8; color:#4a5568; }
.summaryline { font-size:13px; color:#6b7280; margin-bottom:10px; }
.chartwrap { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
canvas.pie { width:180px; height:180px; }
.legend { font-size:12.5px; line-height:1.9; flex:1; min-width:180px; }
.legend .dot { display:inline-block; width:10px; height:10px; border-radius:3px; margin-right:6px; }
.legend .pct { color:#8a90a0; margin-left:4px; }
.budgetlist { display:flex; flex-direction:column; gap:9px; }
.brow .btop { display:flex; justify-content:space-between; font-size:12.5px; margin-bottom:3px; }
.brow .btop .used { color:#8a90a0; }
.bar { height:9px; background:#edf0f6; border-radius:5px; overflow:hidden; }
.bar > div { height:100%; border-radius:5px; background:#57b26a; transition:width .35s; }
.bar.warn50 > div { background:#e6c017; }
.bar.warn80 > div { background:#f07f17; }
.bar.over > div { background:#e05252; }
.history { max-height:260px; overflow-y:auto; }
.hrow { display:flex; align-items:center; gap:10px; padding:8px 4px; border-bottom:1px solid #f0f2f7; font-size:14px; }
.hrow .cat { width:26px; height:26px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:14px; flex-shrink:0; }
.hrow .info { flex:1; min-width:0; }
.hrow .note { font-size:12px; color:#8a90a0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.hrow .amt { font-weight:bold; font-variant-numeric:tabular-nums; }
.hrow .del { background:none; border:none; color:#c0c4cf; font-size:16px; cursor:pointer; padding:0 4px; }
.hrow .del:hover { color:#e05252; }
.monthsel { display:flex; align-items:center; gap:8px; margin-bottom:10px; font-size:13px; color:#6b7280; }
.monthsel select { flex:0 0 auto; padding:4px 8px; font-size:13px; }
.footer { text-align:center; color:#a5abb8; font-size:12px; margin-top:22px; }
dialog { border:none; border-radius:14px; padding:20px; box-shadow:0 10px 40px rgba(0,0,0,.2); width:min(92vw,360px); }
dialog::backdrop { background:rgba(0,0,0,.35); }
dialog h3 { font-size:16px; margin-bottom:12px; }
.setrow { display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; font-size:13.5px; gap:10px; }
.setrow input { width:90px; flex:none; padding:6px 8px; }
.tip { font-size:12px; color:#a5abb8; margin-top:8px; }
/* ===== 概览仪表盘 ===== */
.hero { background:linear-gradient(135deg,#4a7df0,#7c5cff); border-radius:16px; padding:18px; color:#fff; margin-bottom:14px; box-shadow:0 4px 16px rgba(74,125,240,.25); }
.hero .htitle { font-size:13px; opacity:.85; }
.hero .hbig { font-size:34px; font-weight:bold; margin:4px 0 2px; font-variant-numeric:tabular-nums; }
.hero .hsub { font-size:12.5px; opacity:.9; }
.gauges { display:flex; gap:12px; flex-wrap:wrap; margin-top:14px; }
.gauge { flex:1; min-width:130px; background:rgba(255,255,255,.14); border-radius:12px; padding:10px 12px; }
.gauge .glabel { font-size:12px; opacity:.85; }
.gauge .gval { font-size:19px; font-weight:bold; margin:2px 0 6px; font-variant-numeric:tabular-nums; }
.gbar { height:7px; background:rgba(255,255,255,.25); border-radius:4px; overflow:hidden; }
.gbar > div { height:100%; border-radius:4px; background:#fff; transition:width .4s; }
.gnote { font-size:11.5px; opacity:.8; margin-top:5px; }
.ringwrap { display:flex; align-items:center; gap:10px; }
canvas.ring { width:96px; height:96px; }
</style>
</head>

<div class="container">

      </div>
    </div>
  </div>

  <div class="footer">账本真身在本 HTML 文件里 · 关掉再开都在</div>
</div>

<dialog id="settingsDlg">
  <h3>月预算设置</h3>
  <div id="setRows"></div>
  <div class="formrow" style="margin-top:10px;">
    <button class="btn ghost" id="cancelSettings">取消</button>

</dialog>

<script>
const CATS = [
  {id:"food",    name:"吃饭",       icon:"🍚", color:"#f2994a"},
  {id:"dinner",  name:"聚餐",       icon:"🍲", color:"#c05621"},
  {id:"drink",   name:"咖啡零食",   icon:"☕", color:"#eb5757"},
  {id:"trans",   name:"交通",       icon:"🚇", color:"#27ae60"},
  {id:"daily",   name:"日用日化",   icon:"🧴", color:"#56ccf2"},
  {id:"utility", name:"水电",       icon:"💡", color:"#0f9d9d"},
  {id:"sport",   name:"运动健身",   icon:"🏋️", color:"#eab308"},
  {id:"fun",     name:"娱乐社交",   icon:"🎮", color:"#9b51e0"},
  {id:"phone",   name:"话费网费",   icon:"📱", color:"#5b8def"},
  {id:"ai",      name:"AI订阅",     icon:"🤖", color:"#7c5cff"},
  {id:"travel",  name:"大额专项",   icon:"🧾", color:"#00b8a9"},
  {id:"misc",    name:"机动",       icon:"🆘", color:"#95a3b8"},
];
const FILE_DATA = JSON.parse(document.getElementById("ledger-data").textContent);
const L_KEY="local_entries_v2", H_KEY="hidden_ids_v2", B_KEY="budgets_local_v2";
const CUR = (()=>{ const n=new Date(); return {y:n.getFullYear(), m:n.getMonth()+1}; })();

let localEntries = [], hiddenIds = [], localBudgets = {};
try { localEntries = JSON.parse(localStorage.getItem(L_KEY)||"[]"); } catch(e){ localEntries=[]; }
try { hiddenIds = JSON.parse(localStorage.getItem(H_KEY)||"[]"); } catch(e){ hiddenIds=[]; }
try { localBudgets = JSON.parse(localStorage.getItem(B_KEY)||"{}"); } catch(e){ localBudgets={}; }
function saveLocal(){ localStorage.setItem(L_KEY, JSON.stringify(localEntries)); }
function saveHidden(){ localStorage.setItem(H_KEY, JSON.stringify(hiddenIds)); }
function saveBudgets(){ localStorage.setItem(B_KEY, JSON.stringify(localBudgets)); }
function budgetOf(id){ return localBudgets[id]!=null ? localBudgets[id] : (FILE_DATA.budgets[id]!=null ? FILE_DATA.budgets[id] : 0); }

const catById = id => CATS.find(c=>c.id===id) || CATS[CATS.length-1];

// 合并：文件账(f-) + 本机临时账(l-) - 已删除的
function merged(){
  const m = new Map();
  FILE_DATA.entries.forEach(e=>m.set(e.id, e));
  localEntries.forEach(e=>m.set(e.id, e));
  hiddenIds.forEach(id=>m.delete(id));
  return [...m.values()];
}

// 固定支出：每月自动补一条上月同类的复制
function autoFixed(){
  const now = new Date();
  const mo = now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0");
  const all = merged();
  const cats = [...new Set(all.filter(e=>e.fixed).map(e=>e.cat))];
  let changed = false;
  cats.forEach(cat=>{
    if (!all.some(e=>e.fixed && e.cat===cat && e.date.startsWith(mo))) {
      const src = all.filter(e=>e.fixed && e.cat===cat).sort((a,b)=>a.date<b.date?1:-1)[0];
      localEntries.push({id:"l-fixed-"+mo+"-"+cat, date:mo+"-01", cat, amount:src.amount, note:(src.note||"固定支出")+"（自动）", fixed:true});
      changed = true;
    }
  });
  if (changed) saveLocal();
}

// ---------- 月份下拉 ----------
function initMonthSel(){
  const sel = document.getElementById("monthSel");
  const set = new Set(merged().map(e=>e.date.slice(0,7)));
  set.add(CUR.y+"-"+String(CUR.m).padStart(2,"0"));
  [...set].sort().reverse().forEach(mo=>{
    const [y,m] = mo.split("-");
    const o = document.createElement("option");
    o.value = mo; o.textContent = `${y}年${parseInt(m)}月`;
    sel.appendChild(o);
  });
  sel.value = CUR.y+"-"+String(CUR.m).padStart(2,"0");
  sel.addEventListener("change", render);
}
function curMonth(){ return document.getElementById("monthSel").value; }

// ---------- 删除 ----------
function delEntry(id){
  if (!id.startsWith("l-")) { alert("正式账不能在这里删"); return; }
  if (!confirm("删除这一笔？")) return;
  localEntries = localEntries.filter(e=>e.id!==id);
  saveLocal(); render();
}

// ---------- 汇总 ----------
function monthEntries(mo){ return merged().filter(e=>e.date.startsWith(mo)); }
function totals(mo){
  const t = {}; CATS.forEach(c=>t[c.id]=0);
  monthEntries(mo).forEach(e=>{ t[e.cat] = (t[e.cat]||0) + e.amount; });
  return t;
}

// ---------- 饼图 ----------
function drawPie(t){
  const cv = document.getElementById("pie"), ctx = cv.getContext("2d");
  const W = cv.width, cx = W/2, cy = W/2, R = W/2-6, r = W*0.30;
  ctx.clearRect(0,0,W,W);
  const total = Object.values(t).reduce((a,b)=>a+b,0);
  if (total<=0) {
    ctx.fillStyle="#c6cbd6"; ctx.font="28px sans-serif"; ctx.textAlign="center";
    ctx.fillText("本月还没记账", cx, cy+10);
    return;
  }
  let a0 = -Math.PI/2;
  const sorted = CATS.filter(c=>t[c.id]>0).sort((a,b)=>t[b.id]-t[a.id]);
  for (const c of sorted) {
    const frac = t[c.id]/total, a1 = a0 + frac*Math.PI*2;
    ctx.beginPath(); ctx.moveTo(cx,cy); ctx.arc(cx,cy,R,a0,a1); ctx.closePath();
    ctx.fillStyle = c.color; ctx.fill();
    a0 = a1;
  }
  ctx.globalCompositeOperation = "destination-out";
  ctx.beginPath(); ctx.arc(cx,cy,r,0,Math.PI*2); ctx.fill();
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = "#2b2f36"; ctx.font="bold 34px sans-serif"; ctx.textAlign="center";
  ctx.fillText("¥"+(Math.round(total*10)/10), cx, cy+2);
  ctx.fillStyle="#8a90a0"; ctx.font="20px sans-serif";
  ctx.fillText("本月合计", cx, cy+32);
}
function renderLegend(t){
  const total = Object.values(t).reduce((a,b)=>a+b,0);
  const el = document.getElementById("legend");
  if (total<=0) { el.innerHTML = '<span style="color:#a5abb8">本月暂无记录</span>'; return; }
  const sorted = CATS.filter(c=>t[c.id]>0).sort((a,b)=>t[b.id]-t[a.id]);
  el.innerHTML = sorted.map(c=>{
    const p = (t[c.id]/total*100);
    return `<div><span class="dot" style="background:${c.color}"></span>${c.name} ¥${t[c.id].toFixed(1)}<span class="pct">(${p.toFixed(0)}%)</span></div>`;
  }).join("");
}

// ---------- 预算进度 + 三档提醒 ----------
function tierOf(pct){ return pct>=1 ? "red" : pct>=0.8 ? "orange" : pct>=0.5 ? "yellow" : null; }
function renderBudgets(t, mo){
  const el = document.getElementById("budgets");
  el.innerHTML = "";
  let alerts = [];
  CATS.forEach(c=>{
    const used = t[c.id]||0, b = budgetOf(c.id);
    if (c.id === "travel") {
      const row = document.createElement("div");
      row.className = "brow";
      row.innerHTML = `<div class="btop"><span>${c.icon} ${c.name} <span class="used">¥${used.toFixed(1)}（专项，不计日常预算）</span></span><span>—</span></div>
        <div class="bar"><div style="width:100%;opacity:.30"></div></div>`;
      el.appendChild(row);
      return;
    }
    const pct = b>0 ? used/b : 0;
    // 只有「真的花了超过时间进度」才报警，避免月中一片红
    const _now = new Date();
    const _days = new Date(_now.getFullYear(), _now.getMonth()+1, 0).getDate();
    const _timePct = _now.getDate()/_days*100;
    const tier = (mo !== curMonth()) ? null : (pct >= 1.02 ? "red" : (pct*100 > _timePct + 10 ? "orange" : null));
    if (tier) alerts.push({c, tier, pct});
    const cls = tier==="red" ? "over" : tier==="orange" ? "warn80" : tier==="yellow" ? "warn50" : "";
    const row = document.createElement("div");
    row.className = "brow";
    row.innerHTML = `<div class="btop"><span>${c.icon} ${c.name} <span class="used">¥${used.toFixed(1)} / ¥${b}</span></span><span>${Math.round(pct*100)}%</span></div>
      <div class="bar ${cls}"><div style="width:${Math.min(pct*100,100)}%"></div></div>`;
    el.appendChild(row);
  });
  const banner = document.getElementById("banner");
  const order = {red:0, orange:1, yellow:2};
  alerts.sort((a,b)=>order[a.tier]-order[b.tier]);
  if (alerts.length) {
    banner.className = "banner " + alerts[0].tier + " show";
    banner.textContent = alerts.map(a=>{
      const p = Math.round(a.pct*100);
      return a.tier==="red" ? `🚨 ${a.c.name} 已超预算（${p}%）`
           : a.tier==="orange" ? `🟠 ${a.c.name} 已用 ${p}%，快到顶了`
           : `🟡 ${a.c.name} 已用 ${p}%`;
    }).join("　");
  } else {
    banner.className = "banner"; banner.textContent = "";
  }
  const spent = Object.values(t).reduce((a,b)=>a+b,0);
  const travelSpent = t["travel"]||0;
  const dailySpent2 = spent - travelSpent;
  const totalBudget = CATS.filter(c=>c.id!=="travel").reduce((a,c)=>a+budgetOf(c.id),0);
  const sl = document.getElementById("saveLine");
  const left = Math.max(0,totalBudget-dailySpent2);
  sl.textContent = `日常已花 ¥${dailySpent2.toFixed(1)} / 预算 ¥${totalBudget}，还剩 ¥${left.toFixed(0)} 额度（额度 ≠ 手里的钱）· 旅游 ¥${travelSpent.toFixed(0)} 另算 · 全月合计 ¥${spent.toFixed(0)}`;
  sl.style.color = left < 600 && mo === curMonth() ? "#b00020" : "#6b7280";
  // 移除上次的收入/余额条，防止重复叠加
  const oldTip = sl.nextElementSibling;
  if (oldTip && oldTip.dataset.tip === "1") oldTip.remove();
  // 收入条
  const inc = (FILE_DATA.income||[]).filter(e=>e.date.startsWith(mo));
  // 账户余额条
  const bal = FILE_DATA.balances;
  if (bal && mo === curMonth()) {
    const total = bal.items.reduce((a,b)=>a+b.amount,0);
    const tip = document.createElement("div");
    tip.style.cssText = "margin-top:12px;padding-top:10px;border-top:1px dashed #e3e6ee;font-size:12.5px;color:#5a6270;line-height:1.9;";
    tip.dataset.tip = "1";
    const incHtml = inc.length ? `💵 <b>本月额外收入</b>：` + inc.map(x=>`${x.date.slice(5)} +¥${x.amount.toFixed(0)}（${x.note}）`).join(" · ") + `，合计 <b style="color:#1e8e3e">+¥${inc.reduce((a,b)=>a+b.amount,0).toFixed(0)}</b><br>` : "";
    tip.innerHTML = incHtml +
      `💰 <b>账户余额</b>（${bal.updated} 更新，合计 <b>¥${total.toFixed(0)}</b>）：` +
      bal.items.map(x=>`${x.name} ¥${x.amount.toFixed(0)}`).join(" · ") +
      `<br><span style="color:#a5abb8">${bal.note||""}</span>`;
    sl.after(tip);
  }
}

// ---------- 流水 ----------
function renderHistory(mo){
  const el = document.getElementById("history");
  const list = monthEntries(mo).map(e=>({e})).sort((a,b)=>a.e.date<b.e.date?1:-1);
  if (!list.length) { el.innerHTML = '<div style="color:#a5abb8;font-size:13px;padding:10px 0;">这个月还没有流水</div>'; return; }
  el.innerHTML = "";
  list.forEach(({e})=>{
    const c = catById(e.cat);
    const row = document.createElement("div");
    row.className = "hrow";
    const tag = e.fixed ? " 🔁" : (e.id.startsWith("l-") ? " ⏳" : "");
    row.innerHTML = `<div class="cat" style="background:${c.color}22">${c.icon}</div>
      <div class="info"><div>${e.date.slice(5)} · ${c.name}${tag}</div>${e.note?`<div class="note">${escapeHtml(e.note)}</div>`:""}</div>
      <div class="amt">¥${e.amount.toFixed(1)}</div>
      <button class="del" title="删除">✕</button>`;
    row.querySelector(".del").addEventListener("click", ()=>delEntry(e.id));
    el.appendChild(row);
  });
}
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m])); }

// ---------- 预算设置（临时预览） ----------
function openSettings(){
  const dlg = document.getElementById("settingsDlg");
  const box = document.getElementById("setRows");
  box.innerHTML = CATS.map(c=>`<div class="setrow"><span>${c.icon} ${c.name}</span><input type="number" min="0" step="10" id="set_${c.id}" value="${budgetOf(c.id)}"></div>`).join("");
  dlg.showModal();
}
document.getElementById("openSettings")?.addEventListener("click", openSettings);
document.getElementById("cancelSettings").addEventListener("click", ()=>document.getElementById("settingsDlg").close());
document.getElementById("saveSettings").addEventListener("click", ()=>{
  CATS.forEach(c=>{
    const v = parseFloat(document.getElementById("set_"+c.id).value);
    if (!isNaN(v)) localBudgets[c.id] = v;
  });
  saveBudgets();
  document.getElementById("settingsDlg").close();
  render();
});

// ---------- 概览仪表盘 ----------
function renderHero(t, mo){
  if (mo !== curMonth()) { document.getElementById("hero").style.display = "none"; return; }
  document.getElementById("hero").style.display = "";
  const spent = Object.values(t).reduce((a,b)=>a+b,0);
  const travel = t["travel"]||0;
  const dailySpent = spent - travel;
  const dailyBudget = CATS.filter(c=>c.id!=="travel").reduce((a,c)=>a+budgetOf(c.id),0);
  const now = new Date();
  const daysInMonth = new Date(now.getFullYear(), now.getMonth()+1, 0).getDate();
  const day = now.getDate();
  const dailyUsedPct = dailyBudget>0 ? dailySpent/dailyBudget*100 : 0;
  const timePct = day/daysInMonth*100;
  const daysLeft = Math.max(1, daysInMonth - day + 1);
  const canSpend = Math.max(0, dailyBudget - dailySpent);
  const bal = FILE_DATA.balances || {};
  const balItems = bal.items || [];
  const balSum = balItems.reduce((a,b)=>a+(+b.amount||0),0);

  document.getElementById("heroBig").textContent = "¥" + Math.round(balSum);
  const balTxt = balItems.map(b=>`${b.name} ¥${(+b.amount).toFixed(b.amount%1?2:0)}`).join(" ＋ ");
  document.getElementById("heroSub").textContent =
    `${balTxt}（${bal.updated||"-"} 更新）`;

  const normalDays = new Set(monthEntries(mo).filter(e=>e.cat!=="travel").map(e=>e.date)).size || day;
  // 只有「天天会发生」的四类才摊到每天：吃饭/聚餐/咖啡零食/交通
  const dayCats = ["food","dinner","drink","trans"];
  const daySpend = dayCats.reduce((a,k)=>a+(t[k]||0),0);
  const avgDaily = daySpend / normalDays;
  // 月底预计余额 = 现在手上的钱 − 剩下几天按日常节奏还要花的钱
  const willSpend = avgDaily * daysLeft;
  const endCash = balSum - willSpend;
  const gauges = [
    {label:"🎯 月底预计还剩", val:`¥${Math.round(endCash)}`, pct: balSum>0 ? Math.max(0,Math.min(endCash/balSum*100,100)) : 0, note:`现在 ¥${Math.round(balSum)} − 剩 ${daysLeft} 天 × 每天 ¥${Math.round(avgDaily)}`},
    {label:"💸 这个月已经花了", val:`¥${Math.round(spent)}`, pct: Math.min(spent/(dailyBudget+travel)*100,100), note:`日常 ¥${dailySpent.toFixed(0)} ＋ 旅游 ¥${travel.toFixed(0)}`},
    {label:"📊 日常预算用了", val:`${dailyUsedPct.toFixed(0)}%`, pct: Math.min(dailyUsedPct,100), note:`预算 ¥${dailyBudget} 是标尺，不是余额；还剩 ¥${Math.round(canSpend)} 额度`},
  ];
  document.getElementById("gauges").innerHTML = gauges.map(g=>`
    <div class="gauge">
      <div class="glabel">${g.label}</div>
      <div class="gval">${g.val}</div>
      <div class="gbar"><div style="width:${g.pct}%"></div></div>
      <div class="gnote">${g.note}</div>
    </div>`).join("");
}

// ---------- 渲染总入口 ----------
function render(){
  const mo = curMonth();
  const t = totals(mo);
  renderHero(t, mo);
  drawPie(t);
  renderLegend(t);
  renderBudgets(t, mo);
  renderHistory(mo);
  const spent = Object.values(t).reduce((a,b)=>a+b,0);
  document.getElementById("summary").textContent = `选中月份已记 ${monthEntries(mo).length} 笔，合计 ¥${spent.toFixed(1)}`;
}

// ---------- init ----------
(function init(){
  autoFixed();
  initMonthSel();
  render();
})();
</script>
